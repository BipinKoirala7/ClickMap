# TODO
# 1. After adding restriction on pushing directly to main, we should avoid running the workflow on main branch.
#    We can do this by adding a "!main" condition to the branches list.
# 2. After we setup a deployment path from both frontend and backend, we should add workflows to deploy the
#    application to the server after there is a push to the main branch. This will be done by adding a new workflow file for deployment.
#

name: test and deploy

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'Backend/**'

  test-backend-app:
    name: test-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            Backend

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: ./Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test link
        run: npm run lint

      - name: Run tests
        env:
          PORT: ${{ vars.PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ACCESS_TOKEN_EXPIRATION: ${{ vars.ACCESS_TOKEN_EXPIRATION }}
          REFRESH_TOKEN_EXPIRATION: ${{ vars.REFRESH_TOKEN_EXPIRATION }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          MORGAN_PROFILE: ${{ vars.MORGAN_PROFILE }}
        run: npm test
